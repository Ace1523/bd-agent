<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>McChrystal Group — LinkedIn Connections</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #06080c;
      --bg-raised: #0c1018;
      --bg-surface: #111620;
      --bg-hover: #161c28;
      --border: #1e2636;
      --accent: #da6123;
      --accent-hover: #e8783f;
      --accent-glow: rgba(218, 97, 35, 0.10);
      --ui: #7c8594;
      --ui-bright: #a0a8b4;
      --text: #e8edf4;
      --text-secondary: #b0b8c8;
      --text-muted: #6b7588;
      --green: #5cb870;
      --green-bg: rgba(92, 184, 112, 0.08);
      --green-text: #6fcf80;
      --amber: #d4a82e;
      --amber-bg: rgba(212, 168, 46, 0.08);
      --amber-text: #e0b840;
      --purple: #a88af0;
      --purple-bg: rgba(168, 138, 240, 0.08);
      --blue: #7ab8f5;
      --blue-bg: rgba(74, 158, 255, 0.08);
      --red: #ef5f5a;
      --red-bg: rgba(239, 95, 90, 0.08);
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.5);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.6);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.7);
      --radius: 10px;
      --radius-sm: 6px;
      --transition: 0.18s ease;
      --font-mono: 'JetBrains Mono', monospace;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Nav ── */
    .topnav {
      background: #04060a;
      display: flex;
      align-items: center;
      padding: 0 24px;
      height: 56px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 1px 0 rgba(218, 97, 35, 0.08), 0 4px 16px rgba(0,0,0,0.5);
    }
    .nav-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-right: 32px;
    }
    .brand-icon { font-size: 18px; color: var(--accent); }
    .brand-text { font-weight: 700; font-size: 15px; letter-spacing: 1.5px; color: var(--text); }
    .nav-link {
      color: var(--ui);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      transition: all var(--transition);
    }
    .nav-link:hover { color: var(--text); background: var(--bg-hover); }
    .nav-search {
      margin-left: auto;
      position: relative;
    }
    .nav-search input {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 13px;
      padding: 6px 12px;
      width: 220px;
      outline: none;
      transition: border-color var(--transition);
    }
    .nav-search input:focus { border-color: var(--accent); }
    .nav-search input::placeholder { color: var(--text-muted); }
    .search-results {
      position: absolute;
      top: 100%;
      right: 0;
      width: 320px;
      background: var(--bg-raised);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      max-height: 300px;
      overflow-y: auto;
      display: none;
      z-index: 200;
      box-shadow: var(--shadow-lg);
    }
    .search-results.visible { display: block; }
    .search-result-item {
      padding: 10px 14px;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      transition: background var(--transition);
    }
    .search-result-item:hover { background: var(--bg-hover); }
    .search-result-item:last-child { border-bottom: none; }
    .search-result-name { font-size: 13px; font-weight: 600; color: var(--text); }
    .search-result-meta { font-size: 11px; color: var(--text-muted); }

    /* ── Content ── */
    .content { max-width: 1280px; margin: 0 auto; padding: 28px 24px 60px; }

    /* ── KPI Row ── */
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 14px;
      margin-bottom: 28px;
    }
    .kpi-card {
      background: var(--bg-raised);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      text-align: center;
    }
    .kpi-value {
      font-size: 28px;
      font-weight: 800;
      color: var(--accent);
      font-family: var(--font-mono);
      line-height: 1.2;
    }
    .kpi-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--ui);
      margin-top: 4px;
    }

    /* ── Partner Breakdown ── */
    .partner-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 24px;
    }
    .partner-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-raised);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition);
    }
    .partner-chip:hover { border-color: var(--accent); color: var(--text); }
    .partner-chip.active { border-color: var(--accent); background: var(--accent-glow); color: var(--text); }
    .partner-chip .count {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      background: rgba(218, 97, 35, 0.12);
      padding: 1px 7px;
      border-radius: 10px;
    }

    /* ── Filter Pills ── */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }
    .filter-pill {
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--ui);
      cursor: pointer;
      transition: all var(--transition);
    }
    .filter-pill:hover { border-color: var(--ui); color: var(--text); }
    .filter-pill.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* ── Card Grid ── */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 16px;
    }
    .region-header {
      grid-column: 1 / -1;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--ui);
      padding: 8px 0 4px;
      border-bottom: 1px solid var(--border);
      margin-top: 8px;
    }

    /* ── Card ── */
    .card {
      background: linear-gradient(180deg, var(--bg-raised) 0%, #090d14 100%);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      cursor: pointer;
      transition: all var(--transition);
    }
    .card:hover {
      border-color: rgba(218, 97, 35, 0.4);
      box-shadow: 0 0 16px rgba(218, 97, 35, 0.1), var(--shadow-md);
    }
    .card.expanded {
      grid-column: 1 / -1;
      box-shadow: 0 0 0 1px var(--border), var(--shadow-lg);
      border-color: var(--ui);
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .card-company {
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.3;
    }
    .card-badges {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      margin-left: 12px;
    }
    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge-connected { background: var(--green-bg); color: var(--green-text); border: 1px solid rgba(92, 184, 112, 0.25); }
    .badge-region { background: var(--blue-bg); color: var(--blue); border: 1px solid rgba(74, 158, 255, 0.25); }
    .badge-pipeline { background: var(--accent-glow); color: var(--accent); border: 1px solid rgba(218, 97, 35, 0.25); }
    .badge-military { background: rgba(212, 168, 46, 0.06); color: var(--amber); border: 1px solid rgba(212, 168, 46, 0.25); }

    .card-meta {
      display: flex;
      gap: 16px;
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 10px;
    }
    .card-meta span { display: flex; align-items: center; gap: 4px; }

    .card-partners {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 4px;
    }
    .partner-tag {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 2px 7px;
      border-radius: 4px;
      background: var(--purple-bg);
      color: var(--purple);
      border: 1px solid rgba(168, 138, 240, 0.2);
    }

    .conn-count {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      color: var(--green-text);
    }

    /* ── Expanded Detail ── */
    .card-detail {
      display: none;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }
    .card.expanded .card-detail {
      display: block;
      animation: fadeIn 0.25s ease;
    }

    .detail-section { margin-bottom: 18px; }
    .detail-section-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--ui-bright);
      margin-bottom: 8px;
    }

    .detail-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .detail-table th {
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--ui);
      padding: 6px 12px 6px 0;
      border-bottom: 1px solid var(--border);
    }
    .detail-table td {
      padding: 8px 12px 8px 0;
      color: var(--text-secondary);
      border-bottom: 1px solid rgba(30, 38, 54, 0.5);
      vertical-align: top;
    }
    .detail-table tr:last-child td { border-bottom: none; }
    .detail-table .poc { color: var(--accent); font-weight: 600; }
    .detail-table .mil-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 3px;
      background: rgba(212, 168, 46, 0.08);
      color: var(--amber);
      border: 1px solid rgba(212, 168, 46, 0.2);
    }

    .conn-group { margin-bottom: 12px; }
    .conn-group-partner {
      font-size: 12px;
      font-weight: 700;
      color: var(--purple);
      margin-bottom: 4px;
    }
    .conn-item {
      font-size: 13px;
      color: var(--text-secondary);
      padding: 3px 0;
    }
    .conn-item .conn-pos { color: var(--text-muted); font-size: 12px; }

    .mil-detail { margin-bottom: 10px; }
    .mil-name { font-weight: 600; color: var(--text); }
    .mil-rank { color: var(--amber-text); font-size: 13px; }
    .mil-info { font-size: 12px; color: var(--text-muted); line-height: 1.5; margin-top: 2px; }

    /* ── Scroll Top ── */
    .scroll-top {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      border: none;
      cursor: pointer;
      font-size: 16px;
      opacity: 0;
      transition: opacity var(--transition);
      z-index: 50;
    }
    .scroll-top.visible { opacity: 1; }

    /* ── Empty ── */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .topnav { padding: 0 14px; }
      .content { padding: 16px 14px 40px; }
      .card-grid { grid-template-columns: 1fr; }
      .card.expanded { grid-column: 1; }
      .kpi-row { grid-template-columns: repeat(2, 1fr); }
      .nav-search input { width: 140px; }
      .detail-table { font-size: 12px; }
    }
  </style>
</head>
<body>
  <nav class="topnav">
    <div class="nav-brand">
      <span class="brand-icon">&#9670;</span>
      <span class="brand-text">McChrystal Overwatch Agent</span>
    </div>
    <a href="index.html" class="nav-link">&#8592; Dashboard</a>
    <div class="nav-search">
      <input type="text" id="search-input" placeholder="Search companies..." autocomplete="off">
      <div id="search-results" class="search-results"></div>
    </div>
  </nav>

  <main class="content">
    <div id="kpi-row" class="kpi-row"></div>
    <div id="partner-row" class="partner-row"></div>
    <div id="filter-bar" class="filter-bar"></div>
    <div id="card-grid" class="card-grid"></div>
  </main>

  <button class="scroll-top" id="scroll-top">&#9650;</button>

  <script>
    let data = null;
    let activeRegion = "all";
    let activePartner = null;

    document.addEventListener("DOMContentLoaded", () => {
      setupScrollTop();
      loadData();
    });

    function setupScrollTop() {
      const btn = document.getElementById("scroll-top");
      window.addEventListener("scroll", () => btn.classList.toggle("visible", window.scrollY > 300));
      btn.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
    }

    async function loadData() {
      try {
        const resp = await fetch("connections.json");
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        data = await resp.json();
        renderAll();
        setupSearch();
      } catch (err) {
        document.getElementById("card-grid").innerHTML =
          '<div class="empty-state">Could not load connections.json.<br>Run <code>python3 import_linkedin.py</code> to generate it.</div>';
        console.error(err);
      }
    }

    function getAllCompanies() {
      const out = [];
      for (const r of data.regions) {
        for (const c of r.companies) {
          out.push({ ...c, region: r.name, region_display: r.display_name });
        }
      }
      return out;
    }

    function getFilteredCompanies() {
      let companies = getAllCompanies();
      if (activeRegion !== "all") {
        companies = companies.filter(c => c.region === activeRegion);
      }
      if (activePartner) {
        companies = companies.filter(c => c.partner_names.includes(activePartner));
      }
      // Sort: by connection count desc, then alphabetically
      companies.sort((a, b) => b.connection_count - a.connection_count || a.company_name.localeCompare(b.company_name));
      return companies;
    }

    function renderAll() {
      renderKPIs();
      renderPartners();
      renderFilters();
      renderCards();
    }

    function renderKPIs() {
      const el = document.getElementById("kpi-row");
      const all = getAllCompanies();
      const totalCompanies = all.length;
      const totalConnections = all.reduce((s, c) => s + c.connection_count, 0);
      const totalRegions = data.regions.length;
      const avgCoverage = data.regions.length
        ? Math.round(data.regions.reduce((s, r) => s + r.coverage_pct, 0) / data.regions.length * 10) / 10
        : 0;

      el.innerHTML = `
        <div class="kpi-card"><div class="kpi-value">${totalCompanies}</div><div class="kpi-label">Connected Companies</div></div>
        <div class="kpi-card"><div class="kpi-value">${fmt(totalConnections)}</div><div class="kpi-label">Total Connections</div></div>
        <div class="kpi-card"><div class="kpi-value">${avgCoverage}%</div><div class="kpi-label">Avg Coverage</div></div>
        <div class="kpi-card"><div class="kpi-value">${data.partner_count}</div><div class="kpi-label">MG Partners</div></div>
        <div class="kpi-card"><div class="kpi-value">${totalRegions}</div><div class="kpi-label">Regions</div></div>
      `;
    }

    function renderPartners() {
      const el = document.getElementById("partner-row");
      // Aggregate partner counts across all regions
      const map = {};
      for (const r of data.regions) {
        for (const pb of r.partner_breakdown) {
          map[pb.partner] = (map[pb.partner] || 0) + pb.company_count;
        }
      }
      const sorted = Object.entries(map).sort((a, b) => b[1] - a[1]);
      el.innerHTML = sorted.map(([name, count]) =>
        `<div class="partner-chip${activePartner === name ? ' active' : ''}" data-partner="${esc(name)}">
          ${esc(name)} <span class="count">${count}</span>
        </div>`
      ).join("");

      el.querySelectorAll(".partner-chip").forEach(chip => {
        chip.addEventListener("click", () => {
          const p = chip.dataset.partner;
          activePartner = activePartner === p ? null : p;
          renderPartners();
          renderCards();
        });
      });
    }

    function renderFilters() {
      const el = document.getElementById("filter-bar");
      const pills = [{ key: "all", label: "All Regions" }];
      for (const r of data.regions) {
        pills.push({ key: r.name, label: r.display_name });
      }
      el.innerHTML = pills.map(p =>
        `<button class="filter-pill${activeRegion === p.key ? ' active' : ''}" data-region="${p.key}">${p.label}</button>`
      ).join("");

      el.querySelectorAll(".filter-pill").forEach(pill => {
        pill.addEventListener("click", () => {
          activeRegion = pill.dataset.region;
          renderFilters();
          renderCards();
        });
      });
    }

    function renderCards() {
      const el = document.getElementById("card-grid");
      const companies = getFilteredCompanies();

      if (!companies.length) {
        el.innerHTML = '<div class="empty-state">No companies match the current filters.</div>';
        return;
      }

      // Group by region when showing all
      let html = "";
      if (activeRegion === "all") {
        for (const r of data.regions) {
          const regionCompanies = companies.filter(c => c.region === r.name);
          if (!regionCompanies.length) continue;
          html += `<div class="region-header">${esc(r.display_name)} — ${regionCompanies.length} companies</div>`;
          html += regionCompanies.map(c => cardHTML(c)).join("");
        }
      } else {
        html = companies.map(c => cardHTML(c)).join("");
      }

      el.innerHTML = html;

      // Expand/collapse
      el.querySelectorAll(".card").forEach(card => {
        card.addEventListener("click", (e) => {
          if (e.target.closest("a")) return;
          card.classList.toggle("expanded");
        });
      });
    }

    function cardHTML(c) {
      const rev = c.revenue_millions ? `$${fmtRev(c.revenue_millions)}` : "";
      const hasMil = c.military_affiliations && c.military_affiliations.length > 0;
      const hasPipeline = !!c.pipeline_match;

      return `<div class="card" data-company="${esc(c.company_name)}">
        <div class="card-header">
          <div class="card-company">${esc(c.company_name)}</div>
          <div class="card-badges">
            <span class="badge badge-connected">${c.connection_count} conn</span>
            <span class="badge badge-region">${c.region}</span>
            ${hasMil ? '<span class="badge badge-military">Military</span>' : ''}
            ${hasPipeline ? '<span class="badge badge-pipeline">In Pipeline</span>' : ''}
          </div>
        </div>
        <div class="card-meta">
          ${rev ? `<span>${rev}</span>` : ''}
          ${c.industry ? `<span>${esc(c.industry)}</span>` : ''}
          ${c.location ? `<span>${esc(c.location)}</span>` : ''}
        </div>
        <div class="card-partners">
          ${c.partner_names.map(p => `<span class="partner-tag">${esc(p)}</span>`).join("")}
        </div>
        <div class="card-detail">
          ${renderLeaders(c)}
          ${renderConnections(c)}
          ${hasMil ? renderMilitary(c) : ''}
        </div>
      </div>`;
    }

    function renderLeaders(c) {
      if (!c.leaders || !c.leaders.length) return "";
      // Show leaders with MG POC first, then others
      const sorted = [...c.leaders].sort((a, b) => {
        if (a.mg_point_of_contact && !b.mg_point_of_contact) return -1;
        if (!a.mg_point_of_contact && b.mg_point_of_contact) return 1;
        return 0;
      });
      const rows = sorted.map(l => `
        <tr>
          <td>${esc(l.name)}${l.is_military ? ' <span class="mil-badge">MIL</span>' : ''}</td>
          <td>${esc(l.role)}</td>
          <td>${l.mg_point_of_contact ? `<span class="poc">${esc(l.mg_point_of_contact)}</span>` : '<span style="color:var(--text-muted)">—</span>'}</td>
        </tr>`).join("");

      return `<div class="detail-section">
        <div class="detail-section-label">Leadership Team (${c.leaders.length})</div>
        <table class="detail-table">
          <tr><th>Name</th><th>Role</th><th>MG Contact</th></tr>
          ${rows}
        </table>
      </div>`;
    }

    function renderConnections(c) {
      if (!c.company_connections || !c.company_connections.length) return "";
      // Group by partner
      const groups = {};
      for (const conn of c.company_connections) {
        const p = conn.mg_partner || "Unknown";
        if (!groups[p]) groups[p] = [];
        groups[p].push(conn);
      }
      const html = Object.entries(groups).sort((a, b) => b[1].length - a[1].length).map(([partner, conns]) =>
        `<div class="conn-group">
          <div class="conn-group-partner">${esc(partner)} (${conns.length})</div>
          ${conns.map(cn => `<div class="conn-item">${esc(cn.connection_name)} <span class="conn-pos">— ${esc(cn.position)}</span></div>`).join("")}
        </div>`
      ).join("");

      return `<div class="detail-section">
        <div class="detail-section-label">Company Connections (${c.company_connections.length})</div>
        ${html}
      </div>`;
    }

    function renderMilitary(c) {
      if (!c.military_affiliations || !c.military_affiliations.length) return "";
      const html = c.military_affiliations.map(m =>
        `<div class="mil-detail">
          <div><span class="mil-name">${esc(m.name)}</span> — <span class="mil-rank">${esc(m.rank)}, ${esc(m.branch)}</span></div>
          ${m.details ? `<div class="mil-info">${esc(m.details)}</div>` : ''}
        </div>`
      ).join("");

      return `<div class="detail-section">
        <div class="detail-section-label">Military Affiliations</div>
        ${html}
      </div>`;
    }

    function setupSearch() {
      const input = document.getElementById("search-input");
      const results = document.getElementById("search-results");
      const all = getAllCompanies();

      input.addEventListener("input", () => {
        const q = input.value.trim().toLowerCase();
        if (!q) { results.classList.remove("visible"); return; }
        const matches = all.filter(c =>
          c.company_name.toLowerCase().includes(q) ||
          (c.industry || "").toLowerCase().includes(q) ||
          c.partner_names.some(p => p.toLowerCase().includes(q))
        ).slice(0, 8);

        if (!matches.length) { results.classList.remove("visible"); return; }
        results.innerHTML = matches.map(c =>
          `<div class="search-result-item" data-company="${esc(c.company_name)}">
            <div class="search-result-name">${esc(c.company_name)}</div>
            <div class="search-result-meta">${c.region} · ${c.connection_count} connections · ${esc(c.industry || '')}</div>
          </div>`
        ).join("");
        results.classList.add("visible");

        results.querySelectorAll(".search-result-item").forEach(item => {
          item.addEventListener("click", () => {
            const name = item.dataset.company;
            results.classList.remove("visible");
            input.value = "";
            // Reset filters, find and expand card
            activeRegion = "all";
            activePartner = null;
            renderFilters();
            renderPartners();
            renderCards();
            setTimeout(() => {
              const card = document.querySelector(`.card[data-company="${CSS.escape(name)}"]`);
              if (card) {
                card.classList.add("expanded");
                card.scrollIntoView({ behavior: "smooth", block: "center" });
              }
            }, 50);
          });
        });
      });

      document.addEventListener("click", (e) => {
        if (!e.target.closest(".nav-search")) results.classList.remove("visible");
      });
    }

    // ── Helpers ──
    function fmt(n) { return n.toLocaleString(); }
    function fmtRev(m) {
      if (m >= 1000) return (m / 1000).toFixed(1).replace(/\.0$/, '') + "B";
      return m + "M";
    }
    function esc(s) {
      if (!s) return "";
      const d = document.createElement("div");
      d.textContent = s;
      return d.innerHTML;
    }
  </script>
</body>
</html>
